# 작업 브랜치에 올리면 → main 에 자동으로 반영합니다.
#
# 이 저장소는 GitHub Pages 가 main 브랜치를 그대로 서비스합니다
# (Settings → Pages → Deploy from a branch, main / root).
# 그래서 main 에 들어가는 순간 1~2분 뒤 실제 사이트가 바뀝니다.
# 이 파일은 그 앞단계 — "작업 브랜치 → main" 합치기 — 를 대신해 줍니다.
#
# ⚠ 처음 한 번만 해 주셔야 하는 설정이 있습니다:
#    저장소 Settings → Actions → General → Workflow permissions 에서
#    "Read and write permissions" 를 켜 주세요. 이 권한이 없으면 아래 push 가
#    거부되어 Actions 탭에 빨간 X 로 남습니다(사이트는 그대로 유지됩니다).

name: main 에 자동 반영

on:
  push:
    branches-ignore:
      - main          # main 에 직접 올린 것은 Pages 가 알아서 배포합니다
  workflow_dispatch:  # Actions 탭에서 손으로 한 번 돌릴 수도 있습니다

# 동시에 여러 번 돌면 서로 밀어내며 실패하므로 한 번에 하나만 돌립니다.
concurrency:
  group: deploy-to-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 합치려면 두 갈래의 역사가 다 있어야 합니다

      - name: main 에 합쳐서 올리기
        run: |
          set -e
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout main
          # 방금 올린 그 시점을 정확히 합칩니다(중간에 또 올려도 뒤섞이지 않게).
          git merge --no-edit "$GITHUB_SHA"
          git push origin main
          echo "main 에 반영했습니다. 1~2분 뒤 사이트에 나타납니다."
